[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Zepholv"
version = "0.3.1"
description = "Blender light-field capture, audited hogel synthesis, phase encoding and stereogram print data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "Pillow>=10,<13",
    "matplotlib>=3.7,<4",
    "plotly>=5.18,<8",
    "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
docs = ["sphinx>=7,<9", "myst-parser>=2,<5"]
cpp = ["pybind11>=2.11,<4", "cmake>=3.18"]
test = ["build>=1.2"]
notebook = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["zepholv*"]

[tool.setuptools.package-data]
"zepholv.stereogram" = ["third_party/*.txt"]

