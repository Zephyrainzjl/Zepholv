<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Zepholv — Computational light fields and phase-only holography</title>
  <desc id="desc">Replaceable project cover. A stylized vector illustration of camera rays, a sampled field, and a phase grating; this is not an experimental reconstruction image.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071c2d"/><stop offset="1" stop-color="#104f53"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#9ce7df" stop-opacity=".02"/><stop offset="1" stop-color="#9ce7df" stop-opacity=".6"/></linearGradient>
    <pattern id="grid" width="21" height="21" patternUnits="userSpaceOnUse"><path d="M21 0H0V21" fill="none" stroke="#83c8c9" stroke-opacity=".25"/></pattern>
    <pattern id="phase" width="18" height="42" patternUnits="userSpaceOnUse"><rect width="18" height="42" fill="#133c50"/><path d="M0 42L18 0M-9 42L9 0M9 42L27 0" stroke="#99e4d5" stroke-width="2" opacity=".75"/></pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <path d="M0 510H1600M1100 0V600" stroke="#b2ebea" stroke-opacity=".08"/>
  <g fill="none" stroke="url(#beam)" stroke-width="1.3">
    <path d="M820 150L1230 178M820 230L1230 178M820 310L1230 178M820 390L1230 178M820 470L1230 178"/>
    <path d="M820 150L1230 420M820 230L1230 420M820 310L1230 420M820 390L1230 420M820 470L1230 420"/>
  </g>
  <g transform="translate(1160 118) skewY(-14)"><rect width="252" height="336" fill="#133348" stroke="#7dcbc7" stroke-opacity=".6"/><rect width="252" height="336" fill="url(#grid)"/><rect x="42" y="84" width="168" height="168" fill="url(#phase)"/></g>
  <g fill="#a1e8e0"><circle cx="820" cy="150" r="4"/><circle cx="820" cy="230" r="4"/><circle cx="820" cy="310" r="4"/><circle cx="820" cy="390" r="4"/><circle cx="820" cy="470" r="4"/></g>
  <text x="90" y="116" fill="#9ed3d3" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="6">COMPUTATIONAL IMAGING</text>
  <text x="82" y="266" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="700" letter-spacing="-5">Zepholv</text>
  <text x="90" y="330" fill="#d4ecee" font-family="Arial,Helvetica,sans-serif" font-size="29">From rendered light fields to phase-only holograms</text>
  <path d="M90 382H650" stroke="#80d2c5" stroke-width="2"/>
  <text x="90" y="431" fill="#acd5d7" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="2">BLENDER  /  HOGEL SYNTHESIS  /  NUMERICAL OPTICS</text>
  <text x="90" y="530" fill="#739eaa" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">A MODULAR PYTHON TOOLKIT</text>
</svg>
